name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" mac/Info.plist)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Info.plist says $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Build and package
        run: ./build.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: WordPop
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          printf '\n安装方法见 [README](https://github.com/%s#安装)。\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "划词查词 $version" --notes-file notes.md
